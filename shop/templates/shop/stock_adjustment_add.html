{% extends 'shop/base.html' %}
{% block title %}New Stock Adjustment{% endblock %}
{% block page_title %}New Stock Adjustment{% endblock %}
{% block content %}

<div class="card card-box p-4 form-shell">
    <form method="post">
        {% csrf_token %}
        <div class="form-section">
            <div class="mb-3">
                <label class="form-label">Variant</label>
                <select name="variant" class="form-control" id="variantSelect" required>
                    <option value="">Select variant</option>
                    {% for variant in variants %}
                        <option value="{{ variant.id }}">{{ variant }} - Stock: {{ variant.current_stock }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Type</label>
                    <select name="adjustment_type" class="form-control" required>
                        <option value="IN">Stock In</option>
                        <option value="OUT">Stock Out</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Quantity</label>
                    <input type="number" name="quantity" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Unit Cost</label>
                    <input type="number" step="0.01" name="unit_cost" class="form-control" value="0">
                </div>
            </div>
            <div class="row g-3 mt-1">
                <div class="col-md-6">
                    <label class="form-label">Batch</label>
                    <select name="target_batch" class="form-control" id="batchSelect">
                        <option value="">Create new batch / auto select</option>
                        {% for batch in batches %}
                            <option
                                value="{{ batch.id }}"
                                data-variant="{{ batch.variant_id }}"
                                data-cost="{{ batch.buying_price }}"
                            >
                                {{ batch.batch_number|default:"No batch" }} - {{ batch.variant }} - Stock: {{ batch.remaining_qty }} - Cost: {{ batch.buying_price|floatformat:"2g" }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Location</label>
                    <select name="location" class="form-control">
                        <option value="">No location</option>
                        {% for location in locations %}
                            <option value="{{ location.id }}">{{ location.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Date</label>
                    <input type="date" name="date" class="form-control">
                </div>
            </div>
            <div class="mt-3">
                <label class="form-label">Reason</label>
                <textarea name="reason" class="form-control" rows="3"></textarea>
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-success"><i class="bi bi-check2"></i> Save Adjustment</button>
            <a href="{% url 'stock_adjustment_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
const variantSelect = document.getElementById('variantSelect');
const batchSelect = document.getElementById('batchSelect');
const unitCostInput = document.querySelector('[name="unit_cost"]');

function filterBatches() {
    const variantId = variantSelect.value;

    for (const option of batchSelect.options) {
        if (!option.value) {
            option.hidden = false;
            continue;
        }
        option.hidden = option.dataset.variant !== variantId;
    }

    if (batchSelect.selectedOptions[0]?.hidden) {
        batchSelect.value = '';
    }
}

variantSelect.addEventListener('change', filterBatches);
batchSelect.addEventListener('change', () => {
    const selected = batchSelect.selectedOptions[0];
    if (selected?.dataset.cost) {
        unitCostInput.value = selected.dataset.cost;
    }
});
filterBatches();
</script>

{% endblock %}
