{% extends 'shop/base.html' %}

{% block title %}Add Product{% endblock %}

{% block page_title %}
Add Product
{% endblock %}

{% block content %}

<div class="card card-box p-4 form-shell">
    <div class="section-title">
        <div>
            <h5>Product Information</h5>
            <p>Add the product once, then manage its variants and details.</p>
        </div>
    </div>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-section">
        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input
                type="text"
                name="name"
                class="form-control"
                required
                placeholder="Example: Tent"
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <input
                type="text"
                name="category"
                class="form-control"
                placeholder="Example: Outdoor"
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea
                name="description"
                class="form-control"
                rows="4"
                placeholder="Optional product description..."
            ></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Product Image</label>
            <input type="file" name="image" class="form-control" accept="image/*">
        </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success"><i class="bi bi-check2"></i> Save Product</button>
            <a href="/products/" class="btn btn-outline-secondary">Cancel</a>
        </div>

    </form>

</div>

{% endblock %}
