{% extends 'shop/base.html' %}

{% block title %}Add Product{% endblock %}

{% block page_title %}
➕ Add Product
{% endblock %}

{% block content %}

<div class="card card-box p-4" style="max-width: 700px;">

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input
                type="text"
                name="name"
                class="form-control"
                required
                placeholder="Example: Tent"
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <input
                type="text"
                name="category"
                class="form-control"
                placeholder="Example: Outdoor"
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea
                name="description"
                class="form-control"
                rows="4"
                placeholder="Optional product description..."
            ></textarea>
        </div>

        <button type="submit" class="btn btn-success">
            Save Product
        </button>

        <a href="/products/" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
