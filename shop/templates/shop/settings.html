{% extends 'shop/base.html' %}

{% block title %}Settings{% endblock %}

{% block page_title %}
Store Settings
{% endblock %}

{% block content %}

<div class="card card-box p-4 form-shell">
    <div class="section-title">
        <div>
            <h5>Store Profile</h5>
            <p>This information appears in the app header and printed invoices.</p>
        </div>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="form-section">
        <div class="mb-3">
            <label class="form-label">Store Name</label>
            <input type="text" name="store_name" class="form-control"
                   value="{{ setting.store_name }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control"
                   value="{{ setting.phone }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control"
                   value="{{ setting.email }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Currency</label>
            <input type="text" name="currency" class="form-control"
                   value="{{ setting.currency }}">
        </div>
        </div>

        <div class="form-section">
        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea name="address" class="form-control" rows="3">{{ setting.address }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Invoice Footer</label>
            <textarea name="invoice_footer" class="form-control" rows="3">{{ setting.invoice_footer }}</textarea>
        </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-success"><i class="bi bi-check2"></i> Save Settings</button>
        </div>

    </form>

</div>

{% endblock %}
