{% extends 'shop/base.html' %}

{% block title %}New Investment Round{% endblock %}
{% block page_title %}New Investment Round{% endblock %}

{% block content %}

<div class="card card-box p-4 form-shell">
    <div class="section-title">
        <div>
            <h5>Round Information</h5>
            <p>Use a round for one business deal, purchase cycle, or batch group.</p>
        </div>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="form-section">
            <div class="mb-3">
                <label class="form-label">Round Name</label>
                <input type="text" name="name" class="form-control" required placeholder="Example: Tent Partnership - Round 1">
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Date</label>
                    <input type="date" name="date" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="ACTIVE">Active</option>
                        <option value="CLOSED">Closed</option>
                    </select>
                </div>
            </div>
            <div class="mt-3">
                <label class="form-label">Note</label>
                <textarea name="note" class="form-control" rows="3"></textarea>
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-success"><i class="bi bi-check2"></i> Save Round</button>
            <a href="{% url 'investment_round_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
