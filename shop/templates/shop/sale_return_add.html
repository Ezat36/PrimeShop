{% extends 'shop/base.html' %}
{% block title %}Add Return{% endblock %}
{% block page_title %}Add Return{% endblock %}
{% block content %}

<div class="card card-box p-4 form-shell">
    <div class="section-title">
        <div>
            <h5>Return Details</h5>
            <p>Returned quantity is added back to stock.</p>
        </div>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="form-section">
            <div class="mb-3">
                <label class="form-label">Sale Item</label>
                <select name="sale_item" class="form-control" required>
                    <option value="">Select sale item</option>
                    {% for item in sale_items %}
                        {% if item.available_to_return > 0 %}
                            <option value="{{ item.id }}">
                                Sale #{{ item.sale.id }} - {{ item.variant }} - Sold: {{ item.quantity }} - Returnable: {{ item.available_to_return }}
                            </option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>

            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Quantity</label>
                    <input type="number" name="quantity" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Refund Amount</label>
                    <input type="number" step="0.01" name="refund_amount" class="form-control" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Date</label>
                    <input type="date" name="date" class="form-control">
                </div>
            </div>

            <div class="mt-3">
                <label class="form-label">Reason</label>
                <textarea name="reason" class="form-control" rows="3"></textarea>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-success"><i class="bi bi-check2"></i> Save Return</button>
            <a href="/sales/returns/" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
