{% extends 'shop/base.html' %}
{% block title %}New Stock Transfer{% endblock %}
{% block page_title %}New Stock Transfer{% endblock %}
{% block content %}
<div class="card card-box p-4 form-shell"><div class="section-title"><div><h5>Transfer Stock</h5><p>Move available stock from one location to another.</p></div></div><form method="post">{% csrf_token %}<div class="form-section"><div class="mb-3"><label class="form-label">Variant</label><select name="variant" class="form-control" required><option value="">Select variant</option>{% for variant in variants %}<option value="{{ variant.id }}">{{ variant }} - Stock: {{ variant.current_stock }}</option>{% endfor %}</select></div><div class="row g-3"><div class="col-md-6"><label class="form-label">From Location</label><select name="from_location" class="form-control" required><option value="">Select location</option>{% for location in locations %}<option value="{{ location.id }}">{{ location.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">To Location</label><select name="to_location" class="form-control" required><option value="">Select location</option>{% for location in locations %}<option value="{{ location.id }}">{{ location.name }}</option>{% endfor %}</select></div></div><div class="row g-3 mt-1"><div class="col-md-6"><label class="form-label">Quantity</label><input type="number" name="quantity" class="form-control" required></div><div class="col-md-6"><label class="form-label">Date</label><input type="date" name="date" class="form-control"></div></div><div class="mt-3"><label class="form-label">Note</label><textarea name="note" class="form-control" rows="3"></textarea></div></div><div class="form-actions"><button class="btn btn-success"><i class="bi bi-check2"></i> Save Transfer</button><a href="/stock-transfers/" class="btn btn-outline-secondary">Cancel</a></div></form></div>
{% endblock %}
