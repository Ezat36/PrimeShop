{% extends 'shop/base.html' %}

{% block title %}Add Customer{% endblock %}

{% block page_title %}
Add Customer
{% endblock %}

{% block content %}

<div class="card card-box p-4 form-shell">
    <div class="section-title">
        <div>
            <h5>Customer Information</h5>
            <p>Keep contact details clean for invoices and balances.</p>
        </div>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="form-section">
        <div class="mb-3">
            <label class="form-label">Customer Name</label>
            <input
                type="text"
                name="name"
                class="form-control"
                required
                placeholder="Example: Ahmad"
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input
                type="text"
                name="phone"
                class="form-control"
                placeholder="Example: 0790000000"
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea
                name="address"
                class="form-control"
                rows="3"
                placeholder="Customer address..."
            ></textarea>
        </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-success"><i class="bi bi-check2"></i> Save Customer</button>
            <a href="/customers/" class="btn btn-outline-secondary">Cancel</a>
        </div>

    </form>

</div>

{% endblock %}
