<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>Prime Shop Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'shop/css/app.css' %}?v=20260616-ui-refresh" rel="stylesheet">

    <style>
        body.login-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 28px;
            background:
                linear-gradient(135deg, rgba(18, 32, 51, .94), rgba(29, 78, 216, .82)),
                url("{% static 'images/logo.png' %}");
            background-size: cover, min(520px, 80vw);
            background-position: center;
            background-repeat: no-repeat;
        }

        .login-shell {
            width: min(960px, 100%);
            display: grid;
            grid-template-columns: 1fr 430px;
            background: rgba(255, 255, 255, .95);
            border: 1px solid rgba(255, 255, 255, .42);
            border-radius: 8px;
            box-shadow: 0 30px 80px rgba(2, 8, 23, .34);
            overflow: hidden;
        }

        .login-panel {
            color: #fff;
            background: #122033;
            padding: 44px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 560px;
        }

        .login-panel img {
            width: 92px;
            height: 92px;
            object-fit: contain;
            background: #fff;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 28px;
        }

        .login-panel h1 {
            font-size: 42px;
            line-height: 1.05;
            font-weight: 850;
            margin-bottom: 14px;
        }

        .login-panel p {
            color: #cbd5e1;
            font-size: 16px;
            max-width: 360px;
        }

        .login-form {
            padding: 44px;
            align-self: center;
        }

        .login-form h2 {
            font-weight: 850;
            margin-bottom: 8px;
        }

        .btn-login {
            width: 100%;
            min-height: 46px;
        }

        @media (max-width: 860px) {
            .login-shell {
                grid-template-columns: 1fr;
            }

            .login-panel {
                min-height: auto;
                padding: 30px;
            }

            .login-panel h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body class="login-page">
    <main class="login-shell">
        <section class="login-panel">
            <div>
                <img src="{% static 'images/logo.png' %}" alt="Prime Shop">
                <h1>Prime Shop</h1>
                <p>Inventory, sales, purchasing, customers and reporting in one focused workspace.</p>
            </div>
            <small>2026 Prime Shop</small>
        </section>

        <section class="login-form">
            <span class="eyebrow">Welcome back</span>
            <h2>Sign in</h2>
            <p class="text-muted mb-4">Enter your account details to continue.</p>

            {% for message in messages %}
                <div class="alert alert-danger">
                    {{ message }}
                </div>
            {% endfor %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autocomplete="username">
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required autocomplete="current-password">
                </div>

                <button class="btn btn-primary btn-login">
                    <i class="bi bi-box-arrow-in-right me-1"></i>
                    Sign In
                </button>
            </form>
        </section>
    </main>
</body>
</html>
