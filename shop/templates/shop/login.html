```html
<!DOCTYPE html>
<html>
<head>
    <title>Prime Shop Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            font-family:'Segoe UI',sans-serif;

            background:
                radial-gradient(circle at 15% 20%, #2563eb 0%, transparent 25%),
                radial-gradient(circle at 85% 80%, #8b5cf6 0%, transparent 25%),
                radial-gradient(circle at 50% 50%, #06b6d4 0%, transparent 20%),
                linear-gradient(135deg,#0f172a,#111827);
        }

        .circle{
            position:absolute;
            border-radius:50%;
            filter:blur(80px);
            opacity:.35;
        }

        .circle1{
            width:300px;
            height:300px;
            background:#2563eb;
            top:-100px;
            left:-100px;
        }

        .circle2{
            width:250px;
            height:250px;
            background:#8b5cf6;
            bottom:-100px;
            right:-100px;
        }

        .circle3{
            width:220px;
            height:220px;
            background:#06b6d4;
            top:45%;
            left:60%;
        }

        .login-card{
            width:460px;

            background:rgba(255,255,255,.95);

            backdrop-filter:blur(20px);

            border-radius:24px;

            padding:40px;

            box-shadow:
                0 20px 50px rgba(0,0,0,.30);

            position:relative;
            z-index:10;
        }

        .logo{
            text-align:center;
            margin-bottom:15px;
        }

        .logo img{
            height:120px;
        }

        .title{
            text-align:center;
            margin-bottom:30px;
        }

        .title h2{
            font-weight:700;
            margin-bottom:5px;
        }

        .title p{
            color:#6c757d;
            margin:0;
        }

        .form-control{
            border-radius:14px;
            padding:12px;
            border:1px solid #dee2e6;
        }

        .form-control:focus{
            box-shadow:0 0 0 .2rem rgba(13,110,253,.15);
        }

        .btn-login{
            width:100%;
            border:none;
            border-radius:14px;
            padding:12px;

            background:linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            color:white;
            font-weight:600;
        }

        .btn-login:hover{
            transform:translateY(-2px);
            transition:.3s;
        }

        .footer{
            margin-top:20px;
            text-align:center;
            color:#6c757d;
            font-size:14px;
        }

    </style>

</head>

<body>

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <div class="login-card">

        {% load static %}

        <div class="logo">
            <img src="{% static 'images/logo.png' %}" alt="Prime Shop">
        </div>

        <div class="title">
            <h2>Prime Shop</h2>
            <p>Inventory & Sales Management System</p>
        </div>

        {% for message in messages %}
            <div class="alert alert-danger">
                {{ message }}
            </div>
        {% endfor %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-4">
                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required
                >
            </div>

            <button class="btn btn-login">
                🔐 Sign In
            </button>

        </form>

        <div class="footer">
            © 2026 of Prime Shop
        </div>

    </div>

</body>
</html>
```
