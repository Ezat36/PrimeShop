{% extends 'shop/base.html' %}
{% block title %}Add Supplier Payment{% endblock %}
{% block page_title %}Add Supplier Payment{% endblock %}
{% block content %}
<div class="card card-box p-4 form-shell"><div class="section-title"><div><h5>Supplier Payment</h5><p>Record payments made to suppliers.</p></div></div><form method="post">{% csrf_token %}<div class="form-section"><div class="mb-3"><label class="form-label">Supplier</label><select name="supplier" class="form-control" required><option value="">Select supplier</option>{% for supplier in suppliers %}<option value="{{ supplier.id }}">{{ supplier.name }}</option>{% endfor %}</select></div><div class="row g-3"><div class="col-md-4"><label class="form-label">Amount</label><input type="number" step="0.01" name="amount" class="form-control" required></div><div class="col-md-4"><label class="form-label">Date</label><input type="date" name="date" class="form-control"></div><div class="col-md-4"><label class="form-label">Method</label><input type="text" name="method" class="form-control" value="Cash"></div></div><div class="mt-3"><label class="form-label">Note</label><textarea name="note" class="form-control" rows="3"></textarea></div></div><div class="form-actions"><button class="btn btn-success"><i class="bi bi-check2"></i> Save Payment</button><a href="/suppliers/payments/" class="btn btn-outline-secondary">Cancel</a></div></form></div>
{% endblock %}
