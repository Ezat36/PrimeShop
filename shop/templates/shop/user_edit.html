{% extends 'shop/base.html' %}

{% block title %}Edit User{% endblock %}

{% block page_title %}
✏ Edit User
{% endblock %}

{% block content %}

<div class="card card-box p-4" style="max-width:750px;">

    <form method="post">
        {% csrf_token %}

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control"
                       value="{{ edit_user.username }}" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control"
                       value="{{ edit_user.email }}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" class="form-control"
                       value="{{ edit_user.first_name }}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" class="form-control"
                       value="{{ edit_user.last_name }}">
            </div>

            <div class="col-md-12 mb-3">
                <label class="form-label">Role</label>
                <select name="group" class="form-control">
                    <option value="">No Role</option>

                    {% for group in groups %}
                        <option value="{{ group.id }}"
                            {% if group in edit_user.groups.all %}
                                selected
                            {% endif %}
                        >
                            {{ group.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-12 mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="password" class="form-control"
                       placeholder="Leave blank to keep current password">
            </div>

            <div class="col-md-6 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="is_active"
                           {% if edit_user.is_active %}checked{% endif %}>
                    <label class="form-check-label">Active User</label>
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="is_staff"
                           {% if edit_user.is_staff %}checked{% endif %}>
                    <label class="form-check-label">Staff Status</label>
                </div>
            </div>

        </div>

        <button class="btn btn-success">Save Changes</button>
        <a href="/users/" class="btn btn-secondary">Cancel</a>

    </form>

</div>

{% endblock %}
