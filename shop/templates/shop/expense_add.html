{% extends 'shop/base.html' %}

{% block title %}Add Expense{% endblock %}

{% block page_title %}
Add Expense
{% endblock %}

{% block content %}

<div class="card card-box p-4 form-shell">
    <div class="section-title">
        <div>
            <h5>Expense Details</h5>
            <p>Record operating costs so profit reports stay accurate.</p>
        </div>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="form-section">
        <div class="mb-3">
            <label class="form-label">Expense Title</label>
            <input type="text" name="title" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-control">
                <option value="Rent">Rent</option>
                <option value="Salary">Salary</option>
                <option value="Delivery">Delivery</option>
                <option value="Utilities">Utilities</option>
                <option value="Transport">Transport</option>
                <option value="Electricity">Electricity</option>
                <option value="Repair">Repair</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" name="amount" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" name="date" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Note</label>
            <textarea name="note" class="form-control" rows="3"></textarea>
        </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-success"><i class="bi bi-check2"></i> Save Expense</button>
            <a href="/expenses/" class="btn btn-outline-secondary">Cancel</a>
        </div>

    </form>

</div>

{% endblock %}
